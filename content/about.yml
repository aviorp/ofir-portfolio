title: אודותיי
description: סטודנטית לעיצוב פנים במכללת ראשון לציון, עם תשוקה לתכנון חללים שמשלבים יופי, פונקציונליות וחוויה אישית.
content: |
  היי, אני **אופיר מירזנדה**, סטודנטית לתואר ראשון בעיצוב פנים במכללת ראשון לציון.

  אני מאמינה שעיצוב הוא לא רק אסתטיקה — הוא חוויה, שפה ודרך חיים. בכל פרויקט שלי אני משלבת חשיבה יצירתית, מחקר עמוק, ותכנון מדויק שמתחשב בצרכים האמיתיים של האנשים שחיים, עובדים או מבקרים בחלל.

  ### הגישה שלי לעיצוב

  הגישה שלי מתמקדת בחיבור בין פונקציונליות לאמוציה. אני עובדת עם חומרים טבעיים, משחקי אור וצל, ופרופורציות שמייצרות תחושת נוחות ושקט. בין אם מדובר בבית פרטי דו-קומתי עם פרטי נגרות מותאמים, חנות אופנה עם קונספט עיצובי ייחודי, או דירת מגורים שדורשת אופטימיזציה חכמה של החלל — אני ניגשת לכל פרויקט עם אותה רמת דיוק ותשומת לב.

  ### מה אני עושה

  - תכנון אדריכלי מלא לבתים פרטיים — תוכניות קומות, חתכים, חזיתות
  - עיצוב פנים למגורים ולמסחר — מטבחים, חדרי רחצה, סלונים, חנויות
  - פרטי נגרות מותאמים אישית — ארונות, מדפים, מערכות אחסון
  - הדמיות תלת-ממדיות — מבטי פנים, חוץ, איזומטריים ואווירים
  - תוכניות עבודה מפורטות ב-AutoCAD עם מידות ופריסת רהיטים
  - מודלים ב-SketchUp ו-Revit
  - קונספטים עיצוביים לחללים מסחריים וקמעונאיים
  - עיבוד גרפי ב-Photoshop ו-Illustrator
