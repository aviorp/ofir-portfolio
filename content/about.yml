title: אודותיי
description: סטודנטית לעיצוב פנים עם תשוקה לתכנון חללים שמשלבים יופי, פונקציונליות וחוויה אישית.
content: |
  היי, אני **אופיר מירזנדה**, סטודנטית לתואר ראשון בעיצוב פנים.
  אני מאמינה שעיצוב הוא לא רק אסתטיקה — הוא חוויה, שפה ודרך חיים.
  בכל פרויקט שלי אני משלבת חשיבה יצירתית, מחקר עמוק, ותכנון מדויק שמתחשב בצרכים האמיתיים של האנשים שחיים, עובדים או מבקרים בחלל.

  ### הגישה שלי לעיצוב

  הגישה שלי לעיצוב נעה בין זרימה וצורניות רכה לבין פתרונות פרקטיים שמייצרים תחושת בית.
  אני אוהבת לעבוד עם חומרים טבעיים, משחקי אור וצל ואמורפיות שמעניקה לחלל תנועה ושקט בו-זמנית.

  ### מה אני עושה

  - תכנון חללים למגורים
  - הדמיות ורינדורים
  - תוכניות עבודה + AutoCAD
  - עבודה עם Rhino, Photoshop ו-Illustrator
  - מחקר קונספט וחוויית משתמש במרחב
  - עיצוב קמעונאי (חנויות), חללים טיפוליים וחללי אירוח
