title: בית פרטי דו-קומתי
description: "פרויקט גמר — תכנון אדריכלי מלא לבית פרטי דו-קומתי הכולל תוכניות קומות מפורטות עם מידות, חתכים אורכיים ורוחביים, פרטי נגרות מותאמים (ארונות תצוגה, מדפים), עיצוב מטבח עם אי מרכזי, חדרי רחצה, והדמיות תלת-ממדיות מלאות בפנים ובחוץ. הפרויקט בוצע ב-SketchUp ו-AutoCAD."
image: /projects/private-house/3d-overview.jpeg
tags: ["פרויקט גמר", "תכנון אדריכלי", "עיצוב פנים", "SketchUp", "AutoCAD", "הדמיות תלת-ממד", "נגרות"]
date: "2025"
