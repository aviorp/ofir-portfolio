title: עיצוב חנות אופנה
description: "תכנון ועיצוב חנות אופנה מקצה לקצה — מקונספט עיצובי ועד תוכנית הגשה סופית. הפרויקט כולל תוכנית בקנה מידה 1:50 עם פריסת מתלים, אזורי תצוגה ומדידה, חתך פנימי בקנה מידה 1:20 המציג את גובה המדפים ובובות התצוגה, והדמיות תלת-ממדיות של החלל עם חומריות של עץ, בד ותאורה רכה."
