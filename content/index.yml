faq:
  title: שאלות נפוצות
  description: תשובות לשאלות הנפוצות על תהליך העבודה והשירותים שלי.
  categories:
    - title: שירותים ותהליך
      questions:
        - label: אילו שירותים אתה מציע?
          content: |
            אני מתמחה בפיתוח Full Stack וב-UX/UI. זה כולל מחקר משתמשים, אפיון, אב-טיפוס אינטראקטיבי, בניית ממשקי משתמש, פיתוח אפליקציות ואתרים רספונסיביים (בעיקר עם Vue.js/Nuxt.js), ופיתוח מערכות עיצוב. המטרה שלי היא ליצור חוויות דיגיטליות שלמות — מהרעיון ועד לפריסה.
        - label: איך נראה תהליך העבודה שלך?
          content: |
            התהליך שלי שיתופי ואיטרטיבי, וכולל בדרך כלל שלבים כמו גילוי ומחקר, יצירת רעיונות ואב-טיפוס, בדיקות משתמשים, עיצוב חזותי ושיתוף פעולה הדוק עם צוותי פיתוח. אני מתאים את התהליך לצרכי הפרויקט, תוך מיקוד תמידי בפתרונות ממוקדי משתמש.
        - label: האם אתה עובד עם סטארט-אפים?
          content: |
            בהחלט! אני אוהב לעבוד עם סטארט-אפים כדי לעצב את חזון המוצר שלהם ולייצר ממשקים ידידותיים למשתמש מהיסוד. אני יכול להתאים את התהליך לסביבת הסטארט-אפ המהירה.
    - title: תמחור ולוחות זמנים
      questions:
        - label: כמה עולה פרויקט אופייני?
          content: |
            עלויות הפרויקט משתנות בהתאם להיקף, מורכבות, תכונות ולוח הזמנים. עבור פרויקטי Full Stack מקיפים, ההתקשרויות שלי מתחילות בדרך כלל מ-₪18,000, עם ממוצע בין ₪30,000 ל-₪90,000. עבור ייעוץ או משימות ספציפיות, שיעור היומי שלי הוא ₪2,500.
        - label: מהם תנאי התשלום שלך?
          content: |
            בדרך כלל אני מבקש מקדמה של 40% לתזמון הפרויקט ותחילת העבודה, עם 60% הנותרים לאחר השלמת הפרויקט ומסירתו. אני מקבל תשלומים בהעברה בנקאית.
        - label: כמה זמן לוקח פרויקט אופייני?
          content: |
            לוחות הזמנים תלויים מאוד בהיקף הפרויקט ובמורכבותו. פרויקטים קטנים יותר עשויים להימשך 3-4 שבועות, בעוד שפרויקטים גדולים יותר יכולים לנוע בין חודשיים לארבעה חודשים. אני תמיד מספק הערכת לוח זמנים מפורטת לאחר שלב הגילוי הראשוני.
        - label: האם אתה מציע תמיכה שוטפת?
          content: |
            כן, ללקוחות הזקוקים לתמיכת פיתוח שוטפת, פיתוח תכונות או תחזוקה, אני מציע אפשרויות ריטיינר חודשי המותאמות לצרכים ספציפיים. בואו נדבר אם זה משהו שמעניין אותך.
    - title: אודות
      questions:
        - label: מה הדבר שאתה הכי אוהב בעבודה שלך?
          content: |
            אני אוהב את האתגר של פתרון בעיות מורכבות דרך עיצוב וטכנולוגיה. זה מתגמל להפליא לראות אנשים מתקשרים עם משהו שיצרתי ומוצאים אותו שימושי ונוח לשימוש. גישור הפער בין צרכי המשתמשים לאפשרויות הטכניות הוא מה שמלהיב אותי באמת.
        - label: מה התחביבים שלך מחוץ לעבודה?
          content: |
            כשאני לא מפתח או מעצב, אפשר למצוא אותי חוקר שכונות תל אביביות, מנסה בתי קפה חדשים, או מטייל בטבע. אני גם נלהב מצילום ולעתים תורם לפרויקטי קוד פתוח.
