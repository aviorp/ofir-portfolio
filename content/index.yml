about:
  title: "קצת עליי"
  description: |
    סטודנטית לעיצוב פנים במכללת ראשון לציון, עם גישה שמאמינה שכל חלל מספר סיפור. במהלך הלימודים התמחיתי בתכנון בתים פרטיים, עיצוב חנויות ודירות מגורים — תוך עבודה מקצה לקצה: מהקונספט הראשוני, דרך תוכניות עבודה מפורטות ב-AutoCAD, מודלים ב-SketchUp ו-Revit, ועד להדמיות תלת-ממדיות סופיות עם חומריות ותאורה.
